<!DOCTYPE html><html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>کافه مارتین</title><style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Tahoma, Arial, sans-serif;
  background:
    radial-gradient(circle at top, #5a3928 0%, #21150f 45%, #100b08 100%);
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 18px;
  color: #fff;
}

.box {
  width: 100%;
  max-width: 430px;
  background: rgba(35, 22, 15, .96);
  border: 1px solid rgba(214, 165, 104, .25);
  border-radius: 28px;
  padding: 25px 21px;
  box-shadow: 0 20px 60px rgba(0,0,0,.45);
}

.logo {
  width: 78px;
  height: 78px;
  margin: 0 auto 12px;
  border-radius: 50%;
  background: linear-gradient(145deg, #d7a66a, #8b572f);
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 38px;
  box-shadow: 0 8px 25px rgba(0,0,0,.35);
}

h1 {
  text-align: center;
  margin: 5px 0;
  font-size: 27px;
  color: #f3d3a5;
}

.subtitle {
  text-align: center;
  color: #c8b4a3;
  font-size: 13px;
  margin-bottom: 24px;
}

label {
  display: block;
  margin: 14px 4px 7px;
  color: #e8c79e;
  font-size: 14px;
  font-weight: bold;
}

input,
textarea,
button {
  width: 100%;
  font-family: inherit;
  font-size: 16px;
  border-radius: 14px;
}

input,
textarea {
  border: 1px solid #594235;
  outline: none;
  background: #17100c;
  color: #fff;
  padding: 14px;
}

input::placeholder,
textarea::placeholder {
  color: #88776a;
}

input:focus,
textarea:focus {
  border-color: #c9955c;
  box-shadow: 0 0 0 3px rgba(201,149,92,.12);
}

textarea {
  height: 125px;
  resize: vertical;
}

button {
  margin-top: 20px;
  padding: 15px;
  border: none;
  background: linear-gradient(135deg, #d29a5e, #956033);
  color: white;
  font-weight: bold;
  cursor: pointer;
}

button:disabled {
  opacity: .6;
}

#status {
  text-align: center;
  margin-top: 16px;
  min-height: 20px;
  font-size: 14px;
}

.footer {
  text-align: center;
  margin-top: 20px;
  color: #806f62;
  font-size: 11px;
}
</style></head><body><div class="box">  <div class="logo">☕</div>  <h1>کافه مارتین</h1>
  <div class="subtitle">با ما در ارتباط باشید</div>  <form id="form"><label>نام شما</label>
<input
  type="text"
  id="name"
  placeholder="نام خود را وارد کنید"
  required
>

<label>شماره تلفن</label>
<input
  type="tel"
  id="phone"
  placeholder="09123456789"
  inputmode="numeric"
  maxlength="11"
  required
>

<label>پیام شما</label>
<textarea
  id="message"
  placeholder="پیام خود را بنویسید..."
  required
></textarea>

<button id="sendBtn" type="submit">
  ☕ ارسال پیام
</button>

  </form>  <div id="status"></div>  <div class="footer">
    کافه مارتین ❤️
  </div></div><script>

const BOT_TOKEN = "8527432701:AAFkqwvdV5ExYAj3VlU1wHvyR4a9isiLx4E";
const CHAT_ID = "5251204928";

const form = document.getElementById("form");
const sendBtn = document.getElementById("sendBtn");
const status = document.getElementById("status");
const phoneInput = document.getElementById("phone");

/* فقط اجازه وارد کردن عدد */
phoneInput.addEventListener("input", function() {
  this.value = this.value.replace(/\D/g, "").slice(0, 11);
});

form.addEventListener("submit", async function(e) {

  e.preventDefault();

  const name = document.getElementById("name").value.trim();
  const phone = phoneInput.value.trim();
  const message = document.getElementById("message").value.trim();

  /* بررسی شماره تلفن */
  if (!/^09\d{9}$/.test(phone)) {
    status.textContent =
      "❌ شماره تلفن باید ۱۱ رقمی و با 09 شروع شود";
    status.style.color = "#ff6b6b";
    phoneInput.focus();
    return;
  }

  const text =
`☕ پیام جدید از سایت کافه مارتین

👤 نام:
${name}

📱 شماره:
${phone}

💬 پیام:
${message}`;

  sendBtn.disabled = true;
  sendBtn.textContent = "در حال ارسال...";
  status.textContent = "";

  try {

    const response = await fetch(
      `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`,
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          chat_id: CHAT_ID,
          text: text
        })
      }
    );

    const result = await response.json();

    if (result.ok) {

      status.textContent = "✅ پیام با موفقیت ارسال شد";
      status.style.color = "#65d391";

      form.reset();

    } else {

      status.textContent = "❌ ارسال ناموفق بود";
      status.style.color = "#ff6b6b";

      console.log(result);
    }

  } catch (error) {

    status.textContent = "❌ خطا در اتصال به تلگرام";
    status.style.color = "#ff6b6b";

    console.log(error);
  }

  sendBtn.disabled = false;
  sendBtn.textContent = "☕ ارسال پیام";

});

</script></body>
  </html>
